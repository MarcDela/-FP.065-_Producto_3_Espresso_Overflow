<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado - Espresso Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="max-w-xl mx-auto px-4 py-16">
    <div class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-8 text-center space-y-4 shadow-2xl">
        <span class="text-4xl">🔒</span>
        <h1 class="text-xl font-bold text-slate-200">Acceso denegado</h1>
        <p class="text-slate-400 text-sm">Tu rol no puede entrar en esta parte de la aplicación.</p>
        <a th:href="@{/}"
           class="inline-block px-5 py-2.5 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-xs transition">
            Volver al catálogo
        </a>
    </div>
</main>
</body>
</html>
