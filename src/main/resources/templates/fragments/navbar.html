<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="navbar" class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

        <!-- Logo / Nombre -->
        <a th:href="@{/}" class="flex items-center gap-2">
            <span class="text-2xl">📚</span>
            <span class="text-xl font-bold bg-gradient-to-r from-teal-400 to-sky-400 bg-clip-text text-transparent">
                Espresso Library
            </span>
        </a>

        <!-- Menú de Navegación -->
        <nav class="flex items-center gap-6 text-sm font-medium">
            <a th:href="@{/}" class="text-slate-300 hover:text-teal-400 transition-colors">Home</a>
            <a sec:authorize="isAuthenticated()"
               th:href="@{/user/prestamos}"
               class="text-slate-300 hover:text-teal-400 transition-colors">Solicitar Préstamo</a>
            <a sec:authorize="isAuthenticated()"
               th:href="@{/user/historial}"
               class="text-slate-300 hover:text-teal-400 transition-colors">Mis Prestamos</a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin}"
               class="px-3 py-1.5 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hover:bg-indigo-500/20 transition">
                ⚙️ Gestión
            </a>

            <div class="pl-4 border-l border-slate-700 flex items-center gap-3">
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
                    <span class="text-xs text-slate-400">
                        Hola, <strong class="text-slate-200" sec:authentication="principal.nombre">Usuario</strong>
                    </span>
                    <span sec:authorize="hasRole('ADMIN')"
                          class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">ADMIN</span>
                    <span sec:authorize="hasRole('USER')"
                          class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-slate-700 text-slate-300 border border-slate-600">USER</span>
                    <form th:action="@{/cerrar-sesion}" method="post">
                        <button type="submit" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
                            Cerrar Sesión
                        </button>
                    </form>
                </div>

                <div sec:authorize="isAnonymous()" class="flex items-center gap-2">
                    <a th:href="@{/registro}"
                       class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700 transition">
                        Registrarse
                    </a>
                    <a th:href="@{/login}"
                       class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-teal-500 text-slate-950 hover:bg-teal-400 transition">
                        Iniciar Sesión
                    </a>
                </div>
            </div>
        </nav>
    </div>
</header>
</html>
