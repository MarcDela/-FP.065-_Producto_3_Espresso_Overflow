<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<header th:fragment="navbar"
        class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

        <!-- Logo -->
        <a th:href="@{/}" class="flex items-center gap-2">

            <span class="text-2xl">📚</span>

            <span class="text-xl font-bold bg-gradient-to-r from-teal-400 to-sky-400 bg-clip-text text-transparent">
                Espresso Library
            </span>

        </a>

        <!-- Menú de navegación -->
        <nav class="flex items-center gap-6 text-sm font-medium">

            <!-- Acceso público -->
            <a th:href="@{/}"
               class="text-slate-300 hover:text-teal-400 transition-colors">
                Home
            </a>

            <!-- Usuario autenticado -->
            <a th:if="${usuarioAutenticado}"
               th:href="@{/user/prestamos}"
               class="text-slate-300 hover:text-teal-400 transition-colors">
                Solicitar Préstamo
            </a>

            <a th:if="${usuarioAutenticado}"
               th:href="@{/user/historial}"
               class="text-slate-300 hover:text-teal-400 transition-colors">
                Mis Préstamos
            </a>

            <!-- Acceso exclusivo ADMIN -->
            <a th:if="${esAdmin}"
               th:href="@{/admin/gestion}"
               class="px-3 py-1.5 rounded-lg bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hover:bg-indigo-500/20 transition">

                ⚙️ Gestión

            </a>

            <!-- Estado de autenticación -->
            <div class="pl-4 border-l border-slate-700 flex items-center gap-3">

                <!-- Usuario autenticado -->
                <div th:if="${usuarioAutenticado}"
                     class="flex items-center gap-3">

                    <span class="text-xs text-slate-400">

                        Hola,

                        <strong class="text-slate-200"
                                th:text="${emailAutenticado}">
                            Usuario
                        </strong>

                    </span>

                    <!-- Indicador de rol -->
                    <span th:if="${esAdmin}"
                          class="px-2 py-1 rounded-md bg-indigo-500/10 text-indigo-400 text-xs font-bold">
                        ADMIN
                    </span>

                    <span th:unless="${esAdmin}"
                          class="px-2 py-1 rounded-md bg-teal-500/10 text-teal-400 text-xs font-bold">
                        USER
                    </span>

                    <!-- Cerrar sesión -->
                    <form th:action="@{/cerrar-sesion}" method="post">

                        <button type="submit"
                                class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">

                            Cerrar Sesión

                        </button>

                    </form>

                </div>

                <!-- Visitante sin autenticar -->
                <div th:unless="${usuarioAutenticado}"
                     class="flex items-center gap-3">

                    <a th:href="@{/registro}"
                       class="text-slate-300 hover:text-teal-400 transition-colors">
                        Registrarse
                    </a>

                    <a th:href="@{/login}"
                       class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-teal-500 text-slate-950 hover:bg-teal-400 transition">

                        Iniciar Sesión

                    </a>

                </div>

            </div>

        </nav>

    </div>

</header>
</html>
