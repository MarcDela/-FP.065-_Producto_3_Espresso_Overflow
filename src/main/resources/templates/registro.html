<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro | Espresso Overflow</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">

</head>

<body>

<div class="registro-container">

    <h1>📚 Espresso Library</h1>

    <p class="subtitle">
        Crea tu cuenta y descubre nuevas historias
    </p>

    <h2>Crear cuenta</h2>

    <div class="error"
         th:if="${errorRegistro}"
         th:text="${errorRegistro}">
    </div>

    <form th:action="@{/registro}" method="post">

        <label for="nombre">Nombre completo</label>

        <input type="text"
               id="nombre"
               name="nombre"
               th:value="${nombre}"
               placeholder="Introduce tu nombre"
               autocomplete="name"
               maxlength="255"
               required>

        <label for="email">Correo electrónico</label>

        <input type="email"
               id="email"
               name="email"
               th:value="${email}"
               placeholder="usuario@email.com"
               autocomplete="email"
               maxlength="255"
               required>

        <label for="telefono">Teléfono (opcional)</label>

        <input type="tel"
               id="telefono"
               name="telefono"
               th:value="${telefono}"
               placeholder="Introduce tu teléfono"
               autocomplete="tel"
               maxlength="255">

        <label for="password">Contraseña</label>

        <input type="password"
               id="password"
               name="password"
               minlength="8"
               maxlength="72"
               placeholder="Mínimo 8 caracteres"
               autocomplete="new-password"
               required>

        <label for="confirmarPassword">
            Confirmar contraseña
        </label>

        <input type="password"
               id="confirmarPassword"
               name="confirmarPassword"
               minlength="8"
               maxlength="72"
               placeholder="Repite tu contraseña"
               autocomplete="new-password"
               required>

        <button type="submit">
            Crear cuenta
        </button>

    </form>

    <div class="links">

        <p>
            ¿Ya tienes una cuenta?
            <a th:href="@{/login}">Iniciar sesión</a>
        </p>

        <p>
            <a th:href="@{/}">Volver al catálogo</a>
        </p>

    </div>

</div>

</body>
</html>
