<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Espresso Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between">

    <!-- Navbar Reutilizable -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="max-w-md mx-auto px-4 py-16 text-center space-y-6">
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-3xl p-8 shadow-2xl space-y-4">
            <span class="text-6xl">🔍</span>
            
            <h1 class="text-4xl font-extrabold text-teal-400" th:text="${status != null ? status : '404'}">404</h1>
            <h2 class="text-xl font-bold text-slate-100">¡Ups! Página no encontrada</h2>
            
            <p class="text-slate-400 text-sm leading-relaxed">
                La ruta a la que intentas acceder no existe o ha sido movida.
            </p>

            <div class="pt-4">
                <a th:href="@{/}" 
                   class="inline-block px-6 py-3 bg-gradient-to-r from-teal-500 to-sky-500 hover:from-teal-400 hover:to-sky-400 text-slate-950 font-extrabold rounded-xl text-xs transition shadow-lg shadow-teal-500/10">
                    ← Volver al Catálogo
                </a>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800/50">
        Espresso Library &copy; 2026
    </footer>
</body>
</html>
