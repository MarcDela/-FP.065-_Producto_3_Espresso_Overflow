<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Espresso Overflow</title>

    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="login-container">

    <h1>📚 Espresso Library</h1>

    <p class="subtitle">
        Tu próxima historia empieza aquí
    </p>

    <h2>Iniciar sesión</h2>

    <div class="error" th:if="${param.error}">
        El correo electrónico o la contraseña son incorrectos.
    </div>

    <div class="success" th:if="${param.logout}">
        Has cerrado sesión correctamente.
    </div>

    <div class="success" th:if="${param.registro}">
        Tu cuenta se ha creado correctamente.
    </div>

    <form th:action="@{/iniciar-sesion}" method="post">

        <label for="email">Correo electrónico</label>

        <input type="email"
               id="email"
               name="email"
               placeholder="usuario@email.com"
               autocomplete="username"
               required>

        <label for="password">Contraseña</label>

        <input type="password"
               id="password"
               name="password"
               placeholder="Introduce tu contraseña"
               autocomplete="current-password"
               required>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

    <div class="links">

        <p>
            ¿No tienes cuenta?
            <a th:href="@{/registro}">Regístrate</a>
        </p>

        <p>
            <a th:href="@{/}">Volver al catálogo</a>
        </p>

    </div>

</div>

</body>
</html>
