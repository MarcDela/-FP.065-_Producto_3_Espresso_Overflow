services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_libreria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - libreria-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: app_libreria:v2.0
    container_name: app_libreria
    restart: always
    env_file:
      - .env
    ports:
      - "${SERVER_PORT}:8082"
    environment:
      DB_HOST: mysql-db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: ${SERVER_PORT}
      SECURITY_USER_NAME: ${SECURITY_USER_NAME}
      SECURITY_USER_PASSWORD: ${SECURITY_USER_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - libreria-net

volumes:
  mysql_data:

networks:
  libreria-net:
    driver: bridge